{% load static %}
<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}TuniSupply AI{% endblock %}</title>
  <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="{% url 'demandes:liste' %}">🛒 TuniSupply <span>AI</span></a>
    <nav>
      <a href="{% url 'demandes:liste' %}">Mes demandes</a>
      <a href="{% url 'demandes:regroupement' %}">Regroupement</a>
      <a class="btn btn-primary" href="{% url 'demandes:creer' %}">+ Nouvelle demande</a>
    </nav>
  </header>

  <main class="container">
    {% for message in messages %}
      <div class="alert alert-{{ message.tags }}">{{ message }}</div>
    {% endfor %}
    {% block content %}{% endblock %}
  </main>
</body>
</html>
