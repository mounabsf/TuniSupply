{% extends 'base.html' %}
{% block content %}
<div class="container mt-4">
    <h2>Confirmation de modification de statut</h2>
    <p>Êtes-vous sûr de vouloir appliquer l'action <strong>{{ action }}</strong> sur l'alerte #{{ alerte.pk }} ?</p>
    
    <form method="post">
        {% csrf_token %}
        <button type="submit" class="btn btn-danger">Confirmer</button>
        <a href="{% url 'anomalies:detail' alerte.pk %}" class="btn btn-secondary">Annuler</a>
    </form>
</div>
{% endblock %}
